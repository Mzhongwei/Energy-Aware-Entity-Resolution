### Mandatory
mode: "embedding-training-inference-evaluation"
version_name: "embeddingtest"

# incremental mode
# NOTE: these absolute paths assume the container mounts pipeline-data-claim at /data
# (see k8s/pvc-manifests/pvc-data.yaml and the "pipeline-data" volume in
# k8s/pipeline/batch/pipeline.yaml / k8s/pipeline/incremental/*.yaml). If that mountPath
# ever changes, these paths must be updated to match -- nothing checks this alignment
# automatically. The PVC itself is populated separately by k8s/scripts/sync-data-pvc.sh.
data_source_A: "/data/exp_datasets/4-1_dirty_dblp_acm/tableA.csv"
data_source_B: "/data/exp_datasets/4-1_dirty_dblp_acm/tableB.csv"
ground_truth: "/data/exp_datasets/4-1_dirty_dblp_acm/matches.txt"
simulator_path: "services/dataStreamSimulator"
kafka:
  topicid: "entity_resolution_process"
  groupid: "er_group"
  bootstrap_servers: "192.168.1.107"
  port: 9092
  partitions: 3
  replication_factor: 1

  # sliding window strategy
  window_strategy: "count"       # "count" or "time"
  window_count: 26               # used if strategy is "count"
  update_frequency: 0            # "csv" (file windows) or "kafka" (poll broker per iteration)

## meta_path:list or list of list (several paths), * 'rid' should appear in meta_path if it is setted
# meta_path: ["name", "rid"]

# STATE MANAGEMENT
state_management:
# bert mode
  bert-dir: "/app/data/bert"
# incremental mode. if execute several config files successively, the embedding_model-name (or version name) can not be the same
  graph-dir: "/app/data/graph"
  graph-name: ""
  embedding-dir: "/app/data/embedding"
  embedding_model-name: ""
  feature_index-dir: "/app/data/index"
  feature_index-name: ""
  predicted_match-dir: "/app/data/predicted"
  predicted_match-name: ""

### Optional
# pipeline
#
# first_wait_timeout_seconds / wait_timeout_seconds, present on every incremental worker's
# task section below: first_wait applies only to the first item this worker ever waits for
# (its whole upstream chain has to cold-start first, which can take much longer than
# steady-state); wait applies to every wait after that, to detect an idle upstream. A
# timeout with no explicit upstream EOS is logged as a [WARNING] and treated as end of
# stream, but it's inherently ambiguous -- upstream may just be slow rather than actually
# done, so check the logs for that warning before trusting an early-looking finish.
normalization:
  first_wait_timeout_seconds: 1800
  wait_timeout_seconds: 120

candidate_generation:
  status: True
  method: "fullindexing"
  data_pairs_fixed: ""

graph_construction:
  # node types explained in README
  node_types:
    - "5#__tn"                   # numerical instance
    - "5$__tt"                   # textual instance
    - "5$__st"                   # instence after tokenization
    - "3$__idx"
    - "1$__cid"
  flatten: "tt"                  # split prefix for nodes
  smoothing_method: "no"         # smooth method: log/no
  directed: false                # whether the graph is directed
  ngram:                         # config node_type like ["5#__idx", "0#__cid", "0#__tt", "0#__tn", "0#__ng"] if ngram activated
    # token_n: [2, 3]
    # char_n: []
    # skip: 0                    # How many positions can there be between words when forming an n-gram
  first_wait_timeout_seconds: 1800
  wait_timeout_seconds: 120


random_walk:
  write_walks: false
  walk_length: 30                # step size
  walks_number: 10               # number of sentences per root
  backtrack: false               # whether to allow return to previous node
  rw_stat: false                 # statistical result of random walk
  first_wait_timeout_seconds: 1800
  wait_timeout_seconds: 120

cg_feature_extraction:
  first_wait_timeout_seconds: 1800
  wait_timeout_seconds: 120

embeddings_training:
  learning_method: "skipgram"    # skipgram / CBOW
  window_size: 3
  n_dimensions: 128
  training_algorithm: "word2vec" # word2vec / fasttext
  sampling_factor: 0.001
  first_wait_timeout_seconds: 1800
  wait_timeout_seconds: 120

candidate_enumeration:
  first_wait_timeout_seconds: 1800
  wait_timeout_seconds: 120

calculating_similarity:
  first_wait_timeout_seconds: 1800
  wait_timeout_seconds: 120
  # Separate timeouts for the embedding-model snapshot wait: it waits for one specific
  # window's .emb file from embedding_training, not a stream, so it has no EOS concept of
  # its own -- every timeout here is logged, not just the ones without an explicit EOS.
  embedding_first_wait_timeout_seconds: 1800
  embedding_wait_timeout_seconds: 30

decision_making:
  top_k: 10                      # top K most similar entries to keep
  simlist_n: 10                  # how many records to evaluate similarity for
  simlist_show: 5                # how many to print/show
  strategy_suppl: "basic"        # similarity algorithm: basic / faiss
  sim_structure: "graph"         # list / graph
  output_format: "graphml"            # db / json / parquet / graphml
  first_wait_timeout_seconds: 1800
  wait_timeout_seconds: 120

bert_training:

bert_inference:

evaluation:
  # How long entries/worker/evaluation.py waits for the first decision_making event before
  # giving up (the whole candidate_enumeration/calculating_similarity/decision_making chain
  # has to produce its first output first, which can take much longer than a steady-state
  # window). Defaults to 1800s if unset.
  first_wait_timeout_seconds: 1800
  # Idle timeout used for every wait after the first event, to detect that the upstream
  # stream has ended. Defaults to 600s if unset.
  wait_timeout_seconds: 600

b_evaluation:
