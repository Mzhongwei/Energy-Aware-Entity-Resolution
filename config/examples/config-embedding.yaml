mode: "embedding-inference-evaluation"
version_name: "testkafka6"

# incremental mode
data_source_A: "Data_example/fodors_zagats-tableA.csv"
data_source_B: "Data_example/fodors_zagats-tableB.csv"
ground_truth: "Data_example/fodors_zagats-matches.txt"
simulator_path: "services/dataStreamSimulator"
kafka:
  topicid: "entity_resolution_process"
  groupid: "er_group"
  bootstrap_servers: "kafka-server.argo.svc.cluster.local"
  port: 9092
  partitions: 3
  replication_factor: 1

  # sliding window strategy
  window_strategy: "count"       # "count" or "time"
  window_count: 26               # used if strategy is "count"
  update_frequency: 0            # "csv" (file windows) or "kafka" (poll broker per iteration)

kafka_chain:
  enabled: true
  end_of_stream: "end_of_stream"
  poll_timeout: 5
  max_empty_polls: 10
  stages:
    normalization:
      input_topic: "entity_resolution_process"
      output_topic: "entity_resolution_normalized"
      groupid: "er_normalization"
    cg_feature_extraction:
      input_topic: "entity_resolution_normalized"
      output_topic: "entity_resolution_cg_feature"
      groupid: "er_cg_feature"
    graph_construction:
      input_topic: "entity_resolution_normalized"
      output_topic: "entity_resolution_graph"
      groupid: "er_graph_construction"
    random_walk:
      input_topic: "entity_resolution_graph"
      output_topic: "entity_resolution_sequences"
      groupid: "er_random_walk"
    feature_index_construction:
      input_topic: "entity_resolution_cg_feature"
      output_topic: "entity_resolution_candidate_pairs"
      groupid: "er_feature_index"
    candidate_enumeration:
      input_topic: "entity_resolution_cg_feature"
      output_topic: "entity_resolution_candidate_pairs"
      groupid: "er_candidate_enumeration"
    embedding_training:
      input_topic: "entity_resolution_sequences"
      output_topic: "entity_resolution_embeddings"
      groupid: "er_embedding_training"
    calculating_similarity:
      input_topic: "entity_resolution_candidate_pairs"
      output_topic: "entity_resolution_matching_pairs"
      groupid: "er_calculating_similarity"
    decision_making:
      input_topic: "entity_resolution_matching_pairs"
      output_topic: ""
      groupid: "er_decision_making"

## meta_path:list or list of list (several paths), * 'rid' should appear in meta_path if it is setted
# meta_path: ["name", "rid"]

# STATE MANAGEMENT
state_management:
# bert mode
  bert-dir: "/app/data/bert"
# incremental mode. if execute several config files successively, the embedding_model-name (or version name) can not be the same
  graph-dir: "/app/data/graph"
  graph-name: ""
  embedding-dir: "/app/data/embedding"
  embedding_model-name: ""
  feature_index-dir: "/app/data/index"
  feature_index-name: ""
  predicted_match-dir: "/app/data/predicted"
  predicted_match-name: ""

# pipeline
normalization:

candidate_generation:
  status: True
  method: "fullindexing"
  data_pairs_fixed: ""

graph_construction:
  # node types explained in README
  node_types:
    - "5#__tn"                   # numerical instance
    - "5$__tt"                   # textual instance 
    - "5$__st"                   # instence after tokenization
    - "3$__idx"
    - "1$__cid"
  flatten: "tt"                  # split prefix for nodes
  smoothing_method: "no"         # smooth method: log/no
  directed: false                # whether the graph is directed
  ngram:                         # config node_type like ["5#__idx", "0#__cid", "0#__tt", "0#__tn", "0#__ng"] if ngram activated
    # token_n: [2, 3]
    # char_n: []
    # skip: 0                    # How many positions can there be between words when forming an n-gram


random_walk:
  write_walks: true
  walk_length: 60                # step size
  walks_number: 20               # number of sentences per root
  backtrack: false               # whether to allow return to previous node
  rw_stat: false                 # statistical result of random walk

embeddings_training:
  learning_method: "skipgram"    # skipgram / CBOW
  window_size: 3
  n_dimensions: 128
  training_algorithm: "word2vec" # word2vec / fasttext
  sampling_factor: 0.001
  
calculating_similarity:

decision_making:
  top_k: 10                      # top K most similar entries to keep
  simlist_n: 10                  # how many records to evaluate similarity for
  simlist_show: 5                # how many to print/show
  strategy_suppl: "basic"        # similarity algorithm: basic / faiss
  sim_structure: "graph"         # list / graph
  output_format: "graphml"            # db / json / parquet / graphml

bert_training:

bert_inference:

evaluation:

b_evaluation:
